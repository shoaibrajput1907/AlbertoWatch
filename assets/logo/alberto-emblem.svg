<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 70" fill="none">
  <!-- Outer circle (watch bezel) -->
  <circle cx="35" cy="35" r="33" stroke="#C8A96B" stroke-width="1.5" fill="none"/>
  <!-- Inner circle -->
  <circle cx="35" cy="35" r="28" stroke="#C8A96B" stroke-width="0.5" fill="none"/>
  
  <!-- Hour markers (12, 3, 6, 9) -->
  <line x1="35" y1="8" x2="35" y2="12" stroke="#C8A96B" stroke-width="1.2"/>
  <line x1="58" y1="35" x2="62" y2="35" stroke="#C8A96B" stroke-width="1.2"/>
  <line x1="35" y1="58" x2="35" y2="62" stroke="#C8A96B" stroke-width="1.2"/>
  <line x1="8" y1="35" x2="12" y2="35" stroke="#C8A96B" stroke-width="1.2"/>
  
  <!-- Small hour markers -->
  <circle cx="47.5" cy="12.5" r="0.6" fill="#C8A96B"/>
  <circle cx="57.5" cy="22.5" r="0.6" fill="#C8A96B"/>
  <circle cx="57.5" cy="47.5" r="0.6" fill="#C8A96B"/>
  <circle cx="47.5" cy="57.5" r="0.6" fill="#C8A96B"/>
  <circle cx="22.5" cy="57.5" r="0.6" fill="#C8A96B"/>
  <circle cx="12.5" cy="47.5" r="0.6" fill="#C8A96B"/>
  <circle cx="12.5" cy="22.5" r="0.6" fill="#C8A96B"/>
  <circle cx="22.5" cy="12.5" r="0.6" fill="#C8A96B"/>
  
  <!-- Letter A integrated as watch hands -->
  <line x1="25" y1="52" x2="35" y2="15" stroke="#C8A96B" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="52" x2="35" y2="15" stroke="#C8A96B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="40" x2="42" y2="40" stroke="#C8A96B" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Center pinion -->
  <circle cx="35" cy="38" r="1.5" fill="#C8A96B"/>
</svg>
